# Origin: EmberBSD portable MOXA serial-core contracts, 2026-10-09.
name: MOXA serial core
on:
  pull_request:
    paths:
      - 'sys/dev/usb/umoxa_frame.*'
      - 'sys/dev/usb/ucom_transport_core.*'
      - 'ember/tools/umoxa-frame-test.*'
      - 'ember/tools/ucom-transport-core-test.*'
      - 'ember/boot/moxa-serial.md'
      - '.github/workflows/moxa-core.yml'
  push:
    branches: [main]
    paths:
      - 'sys/dev/usb/umoxa_frame.*'
      - 'sys/dev/usb/ucom_transport_core.*'
      - 'ember/tools/umoxa-frame-test.*'
      - 'ember/tools/ucom-transport-core-test.*'
      - '.github/workflows/moxa-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Framing and sequential state contracts
        shell: sh
        run: |
          sh ember/tools/umoxa-frame-test.sh "$RUNNER_TEMP/moxa-frame"
          sh ember/tools/ucom-transport-core-test.sh "$RUNNER_TEMP/moxa-state"
          cat "$RUNNER_TEMP/moxa-frame/compiler.txt"
          cat "$RUNNER_TEMP/moxa-frame/sources.sha256"
          cat "$RUNNER_TEMP/moxa-state/sources.sha256"
